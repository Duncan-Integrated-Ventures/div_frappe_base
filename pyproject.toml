[project]
name = "div_frappe_base"
authors = [
    { name = "Duncan Integrated Ventures LLC", email = "support@duncaniv.com"}
]
description = "Extensions and utilities for Frappe"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    # Provider-agnostic LLM client used by div_frappe_base.ai.client. Routes
    # AI Settings → AI Profile rows to ~100 model providers (Gemini, Claude,
    # OpenAI, xAI, Bedrock, Vertex, Ollama, etc.) under a single OpenAI-shaped
    # call interface.
    "litellm",
    # Local embedding model used by div_frappe_base.search.vector to embed
    # text for MariaDB-native cosine search (BAAI/bge-base-en-v1.5). Pulls
    # torch + transformers transitively (~1.5 GB on first install). Weights
    # land in sites/.huggingface_cache on first encode().
    "sentence-transformers",
    # Optional OCR backend for div_frappe_base.ocr.client (OCR Engine type
    # "Tesseract"). Lazy-imported — only pulled at runtime when a Tesseract
    # engine is actually used, and additionally requires the `tesseract-ocr`
    # system binary. The default `PaddleOCR HTTP` and `Vision LLM` engines
    # need neither. Pillow decodes the image bytes for that backend and for
    # the label_capture extractor (image size + barcode decode input).
    "pytesseract",
    "Pillow",
    # ZXing C++ port with Python bindings. Decodes 1D (Code 128) and 2D
    # (Data Matrix, QR) barcodes from a captured label photo in one call
    # (zxingcpp.read_barcodes). Used by div_frappe_base.label_capture.extractor
    # to read every barcode on a label and cross-check it against OCR text.
    # Ships prebuilt wheels — no system dependency.
    "zxing-cpp",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0-dev,<17.0.0-dev"
