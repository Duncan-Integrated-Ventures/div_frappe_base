name: Pytest CI

on:
  push:
    branches:
      - version-15
  pull_request:
    branches:
      - version-15
  workflow_dispatch:
    inputs:
      site_config:
        description: "Site Configuration doc name to pull app versions from"
        default: "npxldev.myerp.host"
        required: false
        type: string

# concurrency:
#   group: develop-div_frappe_base-${{ github.event.number }}
#   cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    name: Server

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: "123"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
            echo "Found merge conflicts"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # Generate a short-lived installation token from the GitHub App.
      # BOT_APP_ID is stored as a repo/org variable; BOT_APP_PRIVATE_KEY as a secret.
      # The token is scoped to only the repos the App is installed on (private deps).
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Limit token scope to the org that owns the private repos.
          owner: npxladmin

      - name: Install Bench, Apps, and Setup Site
        run: bash ${GITHUB_WORKSPACE}/.github/workflows/helper/install.sh
        env:
          DB: mariadb
          APP_UNDER_TEST: "div_frappe_base"
          SITE_CONFIG: ${{ inputs.site_config || 'npxldev.myerp.host' }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          FRAPPE_API_KEY: ${{ secrets.FRAPPE_API_KEY }}
          FRAPPE_API_SECRET: ${{ secrets.FRAPPE_API_SECRET }}

      - name: Run Tests
        run: |
          cd ~/frappe-bench
          source env/bin/activate
          pytest apps/frappe_devutils --disable-warnings -s --site test_site
