name: Diff
on:
  push:
    branches:
      - develop
      - version-15
  pull_request:
    branches:
      - develop
      - version-15

jobs:
  Diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.ref }}

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup requirements
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install rich json_source_map
          wget https://raw.githubusercontent.com/robproject/fsjd/main/frappe_schema_json_diff.py
          chmod +x ./frappe_schema_json_diff.py
          echo "GIT_EXTERNAL_DIFF=./frappe_schema_json_diff.py" >> $GITHUB_ENV
          echo "TABLE_MODE=0" >> $GITHUB_ENV

      - name: Diff
        run: |
          source venv/bin/activate
          git --no-pager diff HEAD~1 HEAD > diff_output.txt
          cat diff_output.txt

