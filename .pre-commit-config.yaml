exclude: "node_modules|.git"
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "div_frappe_base.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-yaml
      - id: no-commit-to-branch
        args: ["--branch", "develop"]
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--check-filenames", "--ignore-words-list", "notin"]
        additional_dependencies:
          - tomli

  - repo: https://github.com/ikamensh/flynt/
    rev: 1.0.1
    hooks:
    -   id: flynt

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: ["--py38-plus"]

  - repo: https://github.com/frappe/black
    rev: 951ccf4d5bb0d692b457a5ebc4215d755618eb68
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 5.0.4
    hooks:
      - id: flake8
        additional_dependencies: ["flake8-bugbear"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        exclude: |
          (?x)^(
            .*node_modules.*|
            div_frappe_base/public/dist/.*|
            div_frappe_base/public/js/lib/.*
          )$


  - repo: https://github.com/agritheory/test_utils
    rev: v1.24.0
    hooks:
      - id: update_pre_commit_config
      - id: validate_frappe_project
      - id: validate_copyright
        files: '\.(js|ts|py|md)$'
        args: ['--app', 'div_frappe_base']
      - id: clean_customized_doctypes
        args: ['--app', 'div_frappe_base']
      - id: validate_customizations
      - id: validate_patches
        args: ['--app', 'div_frappe_base']
      - id: track_overrides
        args: ['--directory', '.', '--app', 'div_frappe_base', '--base-branch', 'version-15']
      - id: check_code_duplication
        args: ['--max-clones', '60', '--max-percentage', '5.0']

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
